steps:
  - name: python:3.12-slim
    entrypoint: sh
    args:
      - -c
      - python -m pip install --no-cache-dir -r requirements.txt && PYTHONPATH=. python -m unittest discover -s tests -v
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
